<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk - KernelSU WebUI</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #131d31;
            --border: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; min-height: 100vh; }
        header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px; position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { background: var(--primary); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: white; }
        .container { max-width: 600px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
        .card-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stat-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
        .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-size: 14px; font-weight: bold; color: var(--text); margin-top: 4px; font-family: monospace; }
        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        button { background: #1e293b; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; text-align: left; }
        button:active { transform: scale(0.98); }
        button.primary { background: var(--primary); border-color: var(--primary); color: white; }
        button.primary:hover { background: var(--primary-hover); }
        button:hover { border-color: #475569; background: #26334d; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        label { font-size: 12px; color: var(--text-muted); }
        input, select { background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 14px; width: 100%; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .terminal { background: #05070a; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-family: monospace; font-size: 11px; color: #34d399; height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .terminal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .badge { background: #1e293b; color: #818cf8; border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-family: monospace; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">R</div>
            <div>
                <h2 style="font-size: 15px; font-weight: 700;">Risk Optimizer</h2>
                <span style="font-size: 11px; color: var(--text-muted);">KernelSU WebUI</span>
            </div>
        </div>
        <div id="device-badge" class="badge">Initializing...</div>
    </header>

    <div class="container">
        <!-- Stats -->
        <div class="card">
            <div class="card-title">📱 Device Status</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">RAM</div>
                    <div id="stat-ram" class="stat-value">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">CPU Cores</div>
                    <div id="stat-cpu" class="stat-value">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Android</div>
                    <div id="stat-android" class="stat-value">--</div>
                </div>
            </div>
        </div>

        <!-- Cleaners -->
        <div class="card">
            <div class="card-title">⚡ Quick Boost & Cleaners</div>
            <div class="btn-grid">
                <button onclick="runRisk('safe')">
                    <span>🛡️ Safe Clean <small style="display:block; color:var(--text-muted); font-size:11px;">Stop 3rd party apps & clear cache</small></span>
                    <span>→</span>
                </button>
                <button onclick="runRisk('aggressive')">
                    <span>🔥 Aggressive Clean <small style="display:block; color:var(--text-muted); font-size:11px;">Stop 3rd party & Google apps</small></span>
                    <span>→</span>
                </button>
                <button onclick="runRisk('trim')">
                    <span>🧹 Clear RAM Cache <small style="display:block; color:var(--text-muted); font-size:11px;">pm trim-caches & drop_caches</small></span>
                    <span>→</span>
                </button>
            </div>
        </div>

        <!-- Performance -->
        <div class="card">
            <div class="card-title">⚙️ System Optimization</div>
            <div class="btn-grid">
                <button onclick="runRisk('compile')">
                    <span>🚀 Monolith Compile <small style="display:block; color:var(--text-muted); font-size:11px;">Optimize packages (speed-profile)</small></span>
                    <span>→</span>
                </button>
                <button onclick="runRisk('clean-cache')">
                    <span>🗂️ Clean App Caches <small style="display:block; color:var(--text-muted); font-size:11px;">Trim caches for all 3rd-party apps</small></span>
                    <span>→</span>
                </button>
            </div>
        </div>

        <!-- Game Downscale -->
        <div class="card">
            <div class="card-title">🎮 Game Overlay Downscale</div>
            <div class="input-group">
                <label>Package Name</label>
                <input type="text" id="pkg-input" placeholder="e.g. com.tencent.ig">
            </div>
            <div class="input-group">
                <label>Resolution Scale</label>
                <select id="scale-select">
                    <option value="0.5">0.5 (50% Performance)</option>
                    <option value="0.6">0.6 (Balanced)</option>
                    <option value="0.75">0.75 (High Quality)</option>
                    <option value="1.0">1.0 (Reset / Native)</option>
                </select>
            </div>
            <button class="primary" onclick="applyDownscale()" style="width:100%; justify-content:center;">Apply Downscale</button>
        </div>

        <!-- Terminal Console -->
        <div class="card">
            <div class="terminal-header">
                <span class="card-title" style="margin-bottom:0;">💻 Output Console</span>
                <button onclick="clearTerminal()" style="padding:4px 8px; font-size:11px; background:#1e293b;">Clear</button>
            </div>
            <div id="terminal-box" class="terminal">// Risk WebUI ready. Click any action above.</div>
        </div>
    </div>

    <script>
        function log(msg) {
            const box = document.getElementById('terminal-box');
            box.textContent += '\n' + msg;
            box.scrollTop = box.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminal-box').textContent = '// Console cleared.';
        }

        function executeShell(cmd, callback) {
            if (window.ksu && typeof window.ksu.exec === 'function') {
                try {
                    window.ksu.exec(cmd, {
                        onStdout: (output) => { if (output) callback(output); },
                        onStderr: (error) => { if (error) callback('[ERR] ' + error); },
                        onExit: (code) => { log(`[Exit code: ${code}]`); }
                    });
                } catch (e) {
                    try {
                        window.ksu.exec(cmd, (res) => {
                            if (res && res.stdout) callback(res.stdout);
                            else callback(JSON.stringify(res));
                        });
                    } catch (err) {
                        callback('[Exception] ' + err.message);
                    }
                }
            } else {
                // Simulation mode for browser testing
                setTimeout(() => {
                    callback(`[Simulation Result for: ${cmd}] Success`);
                }, 300);
            }
        }

        function loadDeviceInfo() {
            log('Detecting device specs...');
            
            // Android Version
            executeShell("getprop ro.build.version.release", (out) => {
                document.getElementById('stat-android').textContent = out.trim() || '14+';
            });

            // RAM Total
            executeShell("grep 'MemTotal' /proc/meminfo | awk '{print int($2/1024) \" MB\"}'", (out) => {
                document.getElementById('stat-ram').textContent = out.trim() || '8 GB';
            });

            // CPU Cores
            executeShell("grep 'processor' /proc/cpuinfo | wc -l", (out) => {
                document.getElementById('stat-cpu').textContent = out.trim() || '8';
                document.getElementById('device-badge').textContent = 'KSU Connected';
            });
        }

        function runRisk(action) {
            log(`\n> Running: ${action}...`);
            executeShell(`sh /data/adb/modules/riskr/system/bin/risk ${action}`, (out) => {
                log(out.trim());
            });
        }

        function applyDownscale() {
            const pkg = document.getElementById('pkg-input').value.trim();
            const scale = document.getElementById('scale-select').value;
            if (!pkg) {
                alert('Please enter a package name first.');
                return;
            }
            log(`\n> Applying Downscale to ${pkg} (${scale})...`);
            executeShell(`sh /data/adb/modules/riskr/system/bin/risk downscale ${pkg} ${scale}`, (out) => {
                log(out.trim());
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadDeviceInfo();
        });
    </script>
</body>
</html>
